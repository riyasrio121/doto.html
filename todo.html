
<!DOCTYPE html>
<html>
<head>
    <title>My To Do List</title>

    <style>
        body {
            font-family: Arial;
            background-color: lightblue;
            text-align: center;
        }

        .container {
            background-color: white;
            width: 350px;
            margin: 100px auto;
            padding: 20px;
            border-radius: 10px;
        }

        input {
            padding: 10px;
            width: 65%;
        }

        button {
            padding: 10px;
            background-color: green;
            color: white;
            border: none;
            cursor: pointer;
        }

        li {
            background-color: lightgray;
            padding: 10px;
            margin: 10px;
            list-style: none;
            text-align: left;
        }
    </style>
</head>

<body>

    <div class="container">
        <h2>My To Do List</h2>

        <input type="text" id="task" placeholder="Enter your task">

        <button onclick="addTask()">Add</button>

        <ul id="taskList"></ul>
    </div>

    <script>
        function addTask() {
            let task = document.getElementById("task").value;

            if (task == "") {
                alert("Please enter a task!");
                return;
            }

            let li = document.createElement("li");
            li.innerHTML = task;

            document.getElementById("taskList").appendChild(li);

            document.getElementById("task").value = "";
        }
    </script>

</body>
</html>
